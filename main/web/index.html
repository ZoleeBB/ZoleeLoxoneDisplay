<!doctype html>
<html lang="hu"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Zolee Loxone Display · Beállítások</title>
<link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head>
<body><header class="mast"><div class="brand"><span class="mark" aria-hidden="true">Z</span><strong>Zolee Loxone Display</strong></div><a href="/update">Frissítés ↗</a></header>
<main><div class="heading"><div><h1>Kijelző beállításai</h1><p id="status" role="status" aria-live="polite">Betöltés…</p></div>
<button id="save" class="primary" disabled>Mentés</button></div>
<nav class="sections" aria-label="Beállításcsoportok">
<button data-section="tabs" aria-current="page">Lapfülek</button><button data-section="loxone">Miniserver</button>
<button data-section="display">Kijelző</button><button data-section="intercom">Kaputelefon</button></nav>
<div id="editor"></div></main>
<dialog id="picker"><div class="dialoghead"><h2 id="pickTitle">Választás</h2><button id="pickClose" aria-label="Bezárás">×</button></div><input id="filter" type="search" placeholder="Keresés név alapján" aria-label="Keresés név alapján"><div id="pickCategory" role="group" aria-label="Háttérkép kategóriája" hidden>
<button type="button" data-category="" aria-pressed="true">Összes</button>
<button type="button" data-category="landscape" aria-pressed="false">Tájképek</button>
<button type="button" data-category="pattern" aria-pressed="false">Minták</button>
</div><div id="choices"></div></dialog>
</body></html>
